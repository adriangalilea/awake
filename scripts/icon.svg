<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- awake: the cup that keeps the Mac up, seen a little from above as the menu bar
       glyph sees it (the rim an ellipse, the coffee inside it, a shallow saucer
       under a foot the bowl eases into). Squircle tile, one warm hue, geometry only. Drawn on a 128 grid
       (the tile 4..124) and placed on the macOS 1024 canvas as its 824 plate. Source
       of truth for awake.icns, Resources/icon.png and the web mark (`mise icon`). -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#3a2d18"/>
      <stop offset="1" stop-color="#1c1712"/>
    </radialGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc76a"/>
      <stop offset="1" stop-color="#e89b3c"/>
    </linearGradient>
    <!-- the well the cup rests in: its far wall casts shade into it, fading to the
         saucer's own colour toward the near lip, which catches the light -->
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e3f1b"/>
      <stop offset="0.55" stop-color="#8a6230"/>
      <stop offset="1" stop-color="#a87a3c"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a18"/>
      <stop offset="1" stop-color="#b8672a"/>
    </linearGradient>
  </defs>

  <g transform="translate(100 100) scale(6.8667) translate(-4 -4)">
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>

    <!-- steam: three breaths, the middle one taller - awake, not idle -->
    <g fill="none" stroke="#ffc76a" stroke-width="5.5" stroke-linecap="round">
      <path d="M46 50c0-6 5-7 5-12 0-3-1.5-4.5-2.5-6" opacity="0.45"/>
      <path d="M60 48c0-8 6-9 6-15 0-4-2-6-3-8" opacity="0.9"/>
      <path d="M74 50c0-6 5-7 5-12 0-3-1.5-4.5-2.5-6" opacity="0.45"/>
    </g>

    <!-- the saucer, one thin solid in the rim's perspective: its front edge shows the
         thickness, and a ring pressed into the top is where the cup sits -->
    <path d="M26 101A34 7.5 0 0 0 94 101V102A34 7.5 0 0 1 26 102z" fill="#7e5829"/>
    <ellipse cx="60" cy="101" rx="34" ry="7.5" fill="#a87a3c"/>
    <ellipse cx="60" cy="100.8" rx="19" ry="3.7" fill="url(#well)"/>
    <path d="M41 100.8A19 3.7 0 0 0 79 100.8" fill="none" stroke="#d19c5a" stroke-width="0.6" opacity="0.8"/>

    <!-- the handle, behind the body so its ends tuck under the side -->
    <path d="M82 68h7a9.5 9.5 0 0 1 0 19h-9" fill="none" stroke="#ffc76a" stroke-width="5.5" stroke-linecap="round"/>

    <!-- the cup: a bowl with a flat foot, its rim an ellipse -->
    <path d="M33 62C33 81 38 93.5 45.5 97.6Q49 100 53.5 100H66.5Q71 100 74.5 97.6C82 93.5 87 81 87 62z" fill="url(#brew)"/>
    <ellipse cx="60" cy="62" rx="27" ry="6.5" fill="#ffd48a"/>
    <ellipse cx="60" cy="62.6" rx="23" ry="4.6" fill="url(#coffee)"/>
  </g>
</svg>
