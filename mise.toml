# awake — one state machine for keep-awake, menu bar + CLI. The verbs
# (`mise <task>` from the repo root):
#   build      the binary (release)
#   check      format + compile everything, debug — the FAST typecheck (0 warnings)
#   install    build + install binary, asleep symlink, launchd agent; restart daemon
#   uninstall  remove binary, symlink, launchd agent (sudoers grant: `awake grant --remove`)
#   clean      remove the build directory
#   notes      draft notes/$VERSION.md from the commits (you then rewrite it)
#   release    `ship release` (swift-utils): signed, notarized dmg → tag → GitHub Release → publish → cask ($TAP)
#   ship-check what would stop a release right now, each blocked gate with its real answer
#   publish    dmg → R2 behind awake.untitled.garden/releases (the COUNTED url) + notes → garden ($GARDEN)
#   icon       render Resources/awake.icns + icon.png from scripts/icon.svg (rsvg-convert)
# Every compiling task runs under scripts/locked.sh (the build mutex);
# scripts/assemble.sh builds the .app for install AND release, one implementation.

[env]
# THE VERSION, single source of truth: it stamps Info.plist and names the tag.
# A mac app has a native version field, so the manifest is truth here and the
# tag is derived from it (the inverse of a Swift library, where the tag IS the
# version because SwiftPM has no manifest field).
VERSION = "0.9.1"
LABEL = "garden.untitled.awake"
# The .app lives in ~/Applications; the CLI is a symlink into the bundle so
# daemon and CLI stay ONE binary.
APP = "{{ env.HOME }}/Applications/awake.app"
APPBIN = "{{ env.HOME }}/Applications/awake.app/Contents/MacOS/awake"
DIST = "dist"

[tasks.build]
description = "Build the awake binary (release)"
run = "scripts/locked.sh swift build -c release"

# The dev loop that COEXISTS with the cask install: the resident agent is
# the cask's (brew upgrade owns it); iterating runs the DEBUG daemon in the
# foreground against the real socket, with the agent stopped for exactly
# that long and restored on exit (^C included). `mise run install` remains
# the full local override for when the dev build should BE the install.
[tasks.dev]
description = "Foreground DEBUG daemon; stops the installed agent, restores it on exit"
run = '''
scripts/locked.sh swift build
"$APPBIN" agent uninstall
trap '"$APPBIN" agent install' EXIT
.build/debug/awake daemon
'''

[tasks.format]
description = "swift-format in place (the Xcode toolchain's)"
run = "xcrun swift-format --recursive Sources/ scripts/ --in-place"

[tasks.lint]
description = "swift-format lint, advisory (format-clean is the gate, not lint taste)"
run = "xcrun swift-format lint --recursive Sources/ scripts/"

[tasks.check]
description = "format + compile everything, debug — the FAST typecheck (must be 0 warnings); recompiles the scenes, so a menu change that breaks one fails here"
run = '''
mise run format
scripts/locked.sh swift build > /dev/null && echo "awake: 0 errors, 0 warnings"
.build/debug/awake-scene scenes/*.scene > /dev/null || .build/debug/awake-scene scenes/*.scene
'''

# THE SHOWCASE. scenes/*.scene are stories played through the real engine against a
# scripted Mac (Sources/awake-scene); each compiles to a timeline @ag/macos-session
# plays on the web, and art.json holds the glyphs and icon drawn by the app's own
# code. The timelines land in this repo (committed, CI checks they are current) and,
# where UI and GARDEN name those checkouts, in the ui studio and the garden.
[tasks.scene]
description = "Compile scenes/*.scene into web timelines + art.json (here, the ui studio, the garden)"
run = '''
scripts/locked.sh swift build --product awake-scene > /dev/null
set -- --out scenes
if [ -n "$UI" ]; then set -- "$@" --out "$UI/public/macos/awake"; fi
if [ -n "$GARDEN" ]; then set -- "$@" --out "$GARDEN/apps/garden/components/scenes/awake"; fi
.build/debug/awake-scene scenes/*.scene --art "$@" ${WATCH:+--watch}
'''

[tasks."scene:watch"]
description = "The studio loop: recompile a scene on every save (open localhost:3100/macos or the garden)"
run = "WATCH=1 mise run scene"

# The films. Each scene is filmed on a MacBook by ui's `scripts/macos-film.ts` (the
# same component the garden plays live, bundled on the spot, no server needed;
# faster than real time: frames drawn in parallel, only distinct ones photographed):
# an animated WebP, which a README shows as an <img> and GitHub plays inline, and an
# mp4 for posts. Films are never committed: they land in dist/films and go to the
# garden's CDN under stable names (cdn.untitled.garden/media/awake/films/<scene>.webp,
# five-minute cache), so the README's links survive every re-film. Needs the ui and
# garden checkouts, named by UI and GARDEN; FILM=<scene> films one.
[tasks.film]
description = "Film the scenes (WebP + mp4) and publish them to cdn.untitled.garden/media/awake/films/"
depends = ["scene"]
run = '''
ui="${UI:?filming needs the ui checkout: set UI to it}"
garden="${GARDEN:?publishing films needs the garden checkout: set GARDEN to it}"
test -f "$ui/scripts/macos-film.ts" || { echo "UI=$ui is not the ui checkout"; exit 1; }
test -d "$garden/tools/release" || { echo "GARDEN=$garden is not the garden checkout"; exit 1; }
mkdir -p dist/films
for s in scenes/${FILM:-*}.scene; do
  n=$(basename "$s" .scene)
  bun "$ui/scripts/macos-film.ts" "scenes/$n.json" --device macbook --accent "#e7a13c" \
    --out "dist/films/$n.webp" --out "dist/films/$n.mp4"
done
pnpm --dir "$garden/tools/release" exec tsx film.ts awake "$PWD"/dist/films/${FILM:-*}.webp "$PWD"/dist/films/${FILM:-*}.mp4
'''

[tasks.icon]
description = "Render Resources/awake.icns + icon.png from scripts/icon.svg (the web surface and the scenes want the flat PNG too)"
sources = ["scripts/icon.svg"]
outputs = ["Resources/awake.icns", "Resources/icon.png"]
run = '''
set -euo pipefail
set_dir=$(mktemp -d)/awake.iconset
mkdir -p "$set_dir"
for pt in 16 32 128 256 512; do
  rsvg-convert -w $pt -h $pt scripts/icon.svg -o "$set_dir/icon_${pt}x${pt}.png"
  rsvg-convert -w $((pt * 2)) -h $((pt * 2)) scripts/icon.svg -o "$set_dir/icon_${pt}x${pt}@2x.png"
done
iconutil -c icns "$set_dir" -o Resources/awake.icns
rsvg-convert -w 512 -h 512 scripts/icon.svg -o Resources/icon.png
'''

[tasks.glyphlab]
description = "Menu-bar preview of candidate icon states (click a variant to cycle) — scripts/glyphlab.swift"
run = "swift scripts/glyphlab.swift"

[tasks.install]
description = "Build + install ~/Applications/awake.app, the awake/asleep symlinks, the agent skill (Claude Code, Codex), the launchd agent"
depends = ["icon"]
run = '''
mise run build
prefix="${PREFIX:-$HOME/.local}"
mkdir -p "$prefix/bin" "$HOME/Library/Logs/awake"
# Assembled and signed beside the live bundle, then swapped in with one rename,
# the way Homebrew moves a bundle: the running daemon restarts into whatever sits
# at $APP, and an image caught unsigned mid-install is one launchd refuses.
stage="$APP.staging"
rm -rf "$stage"
scripts/assemble.sh "$stage"
# Developer ID is REQUIRED: SMAppService refuses to register an agent from an
# ad-hoc bundle (kSMErrorInvalidSignature), and TCC ties notification permission
# to a stable signature (ad-hoc identities churn every rebuild). Discovered, never
# hardcoded, so a fork signs with its own certificate.
# Inner first, then outer: a nested app must carry its own signature before the
# enclosing bundle is sealed over it.
sign_id=$(security find-identity -v -p codesigning 2>/dev/null | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
test -n "$sign_id" || { echo "no 'Developer ID Application' certificate in the keychain: SMAppService refuses ad-hoc bundles"; exit 1; }
codesign --force --sign "$sign_id" "$stage/Contents/Helpers/awake-notifier.app"
codesign --force --sign "$sign_id" "$stage"
rm -rf "$APP.old"
if [ -d "$APP" ]; then mv "$APP" "$APP.old"; fi
mv "$stage" "$APP"
rm -rf "$APP.old"
# CLI = symlinks into the bundle; the binary re-execs through the resolved path
# (main.swift), so Bundle.main is the app and the defaults domain is the daemon's.
ln -sf "$APPBIN" "$prefix/bin/awake"
ln -sf "$APPBIN" "$prefix/bin/asleep"
# The agent skill, linked to the REPO here so editing it updates the live skill in
# every agent at once (a released app links its bundled copy: `awake skill install`).
for skills in "$HOME/.claude/skills" "${CODEX_HOME:-$HOME/.codex}/skills"; do
  [ -d "$(dirname "$skills")" ] || continue
  mkdir -p "$skills"
  ln -sfn "$PWD/skill" "$skills/awake"
done
echo "installed $APP (+ awake, asleep symlinks, the agent skill)"
# The binary owns the agent, not this file: a double click and the first CLI call
# after a Homebrew install register it the same way, one implementation.
"$APPBIN" agent install
'''

[tasks.uninstall]
description = "Remove app, symlinks, launchd agent (sudoers grant: awake grant --remove)"
run = '''
prefix="${PREFIX:-$HOME/.local}"
# Unregister while the bundle exists: SMAppService resolves the agent through it.
test -x "$APPBIN" && "$APPBIN" agent uninstall
rm -rf "$APP"
rm -f "$prefix/bin/awake" "$prefix/bin/asleep"
echo "removed app, symlinks, launchd agent. Sudoers grant: sudo rm /etc/sudoers.d/awake"
'''

[tasks.clean]
run = 'rm -rf .build "$DIST"'

# THE WORDS GATE: a release exists only once a human has written what changed.
# git-cliff DRAFTS from the commits; the draft is raw material, not prose users
# read. Rewrite it, commit it, and that file is the release notes forever.
[tasks.notes]
description = "Draft notes/$VERSION.md from the commits with git-cliff (then REWRITE it for humans)"
run = '''
command -v git-cliff >/dev/null || { echo "git-cliff missing: brew install git-cliff"; exit 1; }
notes="notes/$VERSION.md"
test ! -f "$notes" || { echo "$notes exists already — edit it"; exit 1; }
mkdir -p notes
git-cliff --config .github/cliff.toml --unreleased --tag "$VERSION" -o "$notes"
echo "drafted $notes — REWRITE it for humans, then commit it"
'''

# Notarization is a credentialed act, so releasing is a LOCAL command: the
# certificate is in this keychain and the notary key is in ~/.appstoreconnect,
# neither of which belongs in CI. CI's job is the 0-warning gate, nothing more.
# A keychain profile, so no notary identifier and no key path exists in this
# repo or in any file. Create it once:
#   xcrun notarytool store-credentials awake \
#     --key ~/.appstoreconnect/private_keys/AuthKey_<KEYID>.p8 \
#     --key-id <KEYID> --issuer <ISSUER-UUID>
[tasks.release]
description = "ship release: gates, Developer ID, notarized dmg, tag, GitHub Release, publish, cask (LOCAL: needs the Developer ID + notary profile)"
depends = ["icon", "check"]
# swift-utils' `ship`, one release for every app. A task tool, not [tools]: CI
# (mise check) never releases, so it never builds it.
tools = { "spm:adriangalilea/swift-utils" = { version = "0.19.2", filter_bins = "ship" } }
run = '''
ship release --name awake --app "$DIST/awake.app" \
  --assemble "mise run build && scripts/assemble.sh $DIST/awake.app" \
  --sign Contents/Helpers/awake-notifier.app \
  --github --after "mise run publish" --cask
'''

# Every gate the release would hold, each blocked one with its real answer.
[tasks.ship-check]
description = "ship check: what would stop a release right now"
tools = { "spm:adriangalilea/swift-utils" = { version = "0.19.2", filter_bins = "ship" } }
run = '''
ship check --name awake --app "$DIST/awake.app" --assemble "scripts/assemble.sh $DIST/awake.app" \
  --github --after "mise run publish" --cask
'''

# The garden half of a release, ship's --after: the dmg behind the counted
# download URL, the notes on the surface. It runs BEFORE the cask bump: the
# cask's URL is this one, and brew fetches it the moment the tap updates. The
# untitled garden monorepo's release tool is the ONE writer to the R2 bucket
# behind <slug>.untitled.garden/releases/<file>, the download URL that is
# COUNTED (garden KPI `download`), and `pnpm garden notes` syncs notes/<v>.md
# to the surface's release rows. GARDEN names that checkout; unset (a fork),
# both are skipped and downloads simply go unmeasured.
[tasks.publish]
description = "dmg → R2 behind awake.untitled.garden/releases (the counted url) + notes → garden"
run = '''
dmg="$DIST/awake-$VERSION.dmg"
test -f "$dmg" || { echo "no $dmg: run 'mise release'"; exit 1; }
if [ -z "$GARDEN" ]; then echo "GARDEN is not set, skipping publish (downloads uncounted)"; exit 0; fi
test -d "$GARDEN/tools/release" || { echo "GARDEN=$GARDEN is not the garden checkout"; exit 1; }
url=$(pnpm --dir "$GARDEN/tools/release" exec tsx dmg.ts awake "$PWD/$dmg") && echo "published $url"
cd "$GARDEN" && pnpm --silent garden notes awake
'''
