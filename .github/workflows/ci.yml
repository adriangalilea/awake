# The only thing CI does. Releasing needs a signing certificate and a notary
# key, so it happens locally (`mise run release`); nothing here touches a secret.
# The gate: format-clean (swift-format changes nothing) + 0 warnings.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@5afd9365125449d69deb51e9e5ab2980260832fe # v1.10.1
    permissions:
      contents: read
