# The only thing CI does. Releasing needs a signing certificate and a notary
# key, so it happens locally (`mise run release`); nothing here touches a secret.
# The gate: format-clean (swift-format changes nothing) + 0 warnings.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@e46001ace22a41eec718217045df254cc9fb54cd # v1.4.0
    permissions:
      contents: read
