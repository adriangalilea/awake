# The only thing CI does. Releasing needs a signing certificate and a notary
# key, so it happens locally (`mise run release`); nothing here touches a secret.
# The gate: format-clean (swift-format changes nothing) + 0 warnings.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    uses: adriangalilea/ci/.github/workflows/mise.yml@355bd2330515807555f687b9bcf69e656dee1161 # v1.10.3
    permissions:
      contents: read
